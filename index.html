<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origen.haus — Próximamente</title>
<meta name="description" content="Estamos creando el sitio web de Origen.haus.">

<!-- Favicon: reemplaza con tu archivo cuando lo tengas -->
<link rel="icon" type="image/svg+xml" href="favicon.png">

<!-- Tipografías: Instrument Sans + Instrument Serif -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
  :root {
    --color-bg: #fffbf5;
    --color-primary: #fdac0b;
    --color-primary-hover: #e89a02;
    --color-secondary: #ffedcc;
    --color-accent: #ffd873; /* tono amarillo de contraste, para el resplandor */
    --color-text: #3a2e1a;
    --color-text-muted: #8a7a5f;
    --font-sans: 'Instrument Sans', sans-serif;
    --font-serif: 'Instrument Serif', serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Resplandor de fondo: un amanecer suave detrás del logo */
  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translate(-50%, -55%);
    background: radial-gradient(circle, var(--color-accent) 0%, var(--color-secondary) 40%, transparent 70%);
    opacity: 0;
    filter: blur(10px);
    animation: glow-in 1.8s ease-out 0.1s forwards;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 32px;
    max-width: 560px;
  }

  .logo {
    width: 200px;
    height: auto;
    margin-bottom: 40px;
    opacity: 0;
    transform: translateY(16px);
    animation: rise-in 0.9s ease-out 0.3s forwards;
  }

  h1 {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    line-height: 1.15;
    color: var(--color-text);
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(16px);
    animation: rise-in 0.9s ease-out 0.55s forwards;
  }

  p {
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 1.05rem;
    color: var(--color-text-muted);
    margin-bottom: 40px;
    opacity: 0;
    transform: translateY(16px);
    animation: rise-in 0.9s ease-out 0.8s forwards;
  }

  .cta-button {
    display: inline-block;
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 1rem;
    color: #fffbf5;
    background: var(--color-primary);
    padding: 16px 36px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(253, 172, 11, 0.35);
    transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    opacity: 0;
    transform: translateY(16px);
    animation: rise-in 0.9s ease-out 1.05s forwards;
  }

  .cta-button:hover {
    background: var(--color-primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(253, 172, 11, 0.45);
  }

  .cta-button:focus-visible {
    outline: 3px solid var(--color-text);
    outline-offset: 3px;
  }

  .cta-button:active {
    transform: translateY(0);
  }

  @keyframes rise-in {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes glow-in {
    to {
      opacity: 0.9;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, .logo, h1, p, .cta-button {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }

  @media (max-width: 480px) {
    .logo {
      width: 150px;
      margin-bottom: 28px;
    }
    p {
      font-size: 0.98rem;
    }
  }
</style>
</head>
<body>



  <main class="container">
    <img class="logo" src="logoorigen.svg" alt="Origen">

    <h1>Hola somos origen.haus</h1>
    <p>Estamos creando nuestro sitio web.</p>

    
    <a class="cta-button" href="https://api.whatsapp.com/send?phone=573112062522&text=Hola%20Origen%20Haus,%20vengo%20desde%20su%20sitio%20web%20y%20quiero%20trabajar%20con%20ustedes" target="_blank" rel="noopener">Tengo un proyecto en mente</a>
  </main>

</body>
</html>
